[package]
name = "httpsig-hyper"
version.workspace = true
edition.workspace = true
description = "Hyper extension for http message signatures (RFC9421)"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
readme.workspace = true
rust-version.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
digest-sha256 = []
digest-sha512 = []
ed25519-signature = ["httpsig/ed25519-signature"]
ecdsa-p256-sha256-signature = ["httpsig/ecdsa-p256-sha256-signature"]
ecdsa-p384-sha384-signature = ["httpsig/ecdsa-p384-sha384-signature"]
hmac-sha256-signature = ["httpsig/hmac-sha256-signature"]
pem = ["httpsig/pem"]
key-id = ["httpsig/key-id"]
rsa-signature = ["httpsig/rsa-signature"]


[dependencies]
httpsig = { path = "../httpsig", version = "0.0.24" }

compact_str = "0.9"
thiserror = { version = "2.0.18" }
tracing = { version = "0.1.44" }
indexmap = { version = "2.11.4" }
subtle = { version = "2.6.1", default-features = false }

# content digest with rfc8941 structured field values
sha2 = { version = "0.10.9", default-features = false }
sfv = { version = "0.14.0" }

# encoding
base64 = { version = "0.22.1" }

# for request and response headers
http = { version = "1.4.0" }
http-body = { version = "1.0.1" }
http-body-util = { version = "0.1.3" }
bytes = { version = "1.11.1" }


[dev-dependencies]
httpsig-hyper = { path = ".", features = [
  "digest-sha256",
  "key-id",
  "pem",
  "ed25519-signature",
  "ecdsa-p256-sha256-signature",
  "hmac-sha256-signature",
] }
tokio = { version = "1.49.0", default-features = false, features = [
  "macros",
  "rt-multi-thread",
] } # testing only
futures = { version = "0.3.31", default-features = false, features = [
  "executor",
] }
criterion = "0.8"

[[bench]]
name = "hyper"
harness = false
required-features = ["digest-sha256"]

[[example]]
name = "hyper-response"
required-features = [
  "digest-sha256",
  "ed25519-signature",
  "hmac-sha256-signature",
  "pem",
]


[[example]]
name = "hyper-request"
required-features = [
  "digest-sha256",
  "ed25519-signature",
  "hmac-sha256-signature",
  "pem",
  "key-id",
]
